name: Release

# A `v*` tag builds, tests, packages and publishes. "Run workflow" by hand
# does everything except publishing (a dry run of the release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            archive: kai-linux-x86_64.tar.gz
          - os: windows-latest
            archive: kai-windows-x86_64.zip
          - os: macos-15
            archive: kai-macos-aarch64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb-xfixes0-dev libxcb-randr0-dev libxcb-shape0-dev \
            libfontconfig-dev libdbus-1-dev libxdo-dev libxtst-dev libxrandr-dev libxi-dev \
            libgbm-dev libegl-dev libpipewire-0.3-dev libclang-dev
      # CI is paused, so a release checks itself before it ships.
      - run: cargo test --workspace --release
      - run: cargo build --release -p kai-app -p kai-cli
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/kai
          cp target/release/kai-app target/release/kai dist/kai/
          cp -r skills bench LICENSE README.md dist/kai/
          tar -C dist -czf ${{ matrix.archive }} kai
          sha256sum ${{ matrix.archive }} > ${{ matrix.archive }}.sha256
      - name: Smoke test the packaged CLI (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir smoke && tar -C smoke -xzf ${{ matrix.archive }}
          cd smoke/kai
          ./kai skill validate skills
          ./kai models list
          ./kai bench --backend mock --out ../bench
      - name: Package and smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          scripts/macos/bundle.sh
          mv dist/kai-macos-aarch64.zip dist/kai-macos-aarch64.zip.sha256 .
          ditto -x -k ${{ matrix.archive }} smoke
          smoke/Kai.app/Contents/MacOS/kai bench --backend mock --out smoke/bench
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/kai | Out-Null
          Copy-Item target/release/kai-app.exe, target/release/kai.exe dist/kai/
          Copy-Item -Recurse skills, bench dist/kai/
          Copy-Item LICENSE, README.md dist/kai/
          Compress-Archive -Path dist/kai -DestinationPath ${{ matrix.archive }}
          $h = (Get-FileHash ${{ matrix.archive }} -Algorithm SHA256).Hash.ToLower()
          "$h  ${{ matrix.archive }}" | Out-File -Encoding ascii ${{ matrix.archive }}.sha256
      - name: Smoke test the packaged CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive ${{ matrix.archive }} -DestinationPath smoke
          Set-Location smoke/kai
          ./kai.exe skill validate skills
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./kai.exe models list
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./kai.exe bench --backend mock --out ../bench
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
