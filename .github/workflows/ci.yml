name: CI

# PAUSED (2026-10-13, at the owner's request): research and tests are in
# progress, so pushes to main and pull requests do not start CI. Run it by
# hand from the Actions tab (Run workflow). To resume, restore the `push`
# and `pull_request` triggers from the commit before "CI: paused".
# Validate locally meanwhile (fmt, clippy -D warnings, test, skill validate).
on:
  workflow_dispatch:

# A newer push to the same branch cancels the older run instead of paying
# for both (private-repo Actions minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        if: runner.os == 'Linux'
        # The workspace's debug build (gpui, wgpu, Ely) and its test build
        # together outgrow the runner's free space; drop unused toolchains.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb-xfixes0-dev libxcb-randr0-dev libxcb-shape0-dev \
            libfontconfig-dev libdbus-1-dev libxdo-dev libxtst-dev libxrandr-dev libxi-dev \
            libgbm-dev libegl-dev libpipewire-0.3-dev libclang-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Validate shipped skills (Agent Skill Open Standard)
        run: cargo run -q -p kai-cli -- skill validate skills
      - name: Mock benchmark (harness plumbing)
        run: cargo run -q -p kai-cli -- bench --backend mock --out target/bench
