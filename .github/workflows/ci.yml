name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Full debug info for every dependency (GPUI, Ely, wgpu…) fills the
  # Ubuntu runner's disk during `cargo test`; tests don't need it.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          # Free ~20 GB of preinstalled tools this build never uses.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb-xfixes0-dev libxcb-randr0-dev libxcb-shape0-dev \
            libfontconfig-dev libdbus-1-dev libxdo-dev libxtst-dev libxrandr-dev libxi-dev \
            libgbm-dev libegl-dev libpipewire-0.3-dev libclang-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Validate shipped skills (Agent Skill Open Standard)
        run: cargo run -q -p kai-cli -- skill validate skills
      - name: Mock benchmark (harness plumbing)
        run: cargo run -q -p kai-cli -- bench --backend mock --out target/bench
