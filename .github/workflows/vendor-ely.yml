# One-off (approved by the repo owner): recover the pinned Ely GPUI
# Components source from CI's cargo cache, since the upstream repository can
# no longer be cloned, and commit it to vendor/ely-gpui-component on this
# branch. Commits nothing unless the source carries an MIT or Apache license.
# Removed again once vendored.
name: Vendor Ely

on:
  push:
    branches: [ccr-4caa39f9-oucenj]
    paths: [.github/workflows/vendor-ely.yml]

permissions:
  contents: write

jobs:
  # Named `check` like CI's job so rust-cache restores CI's cache.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Materialise the Ely checkout from the cached git db
        run: |
          ls -la ~/.cargo/git/db/ || true
          CARGO_NET_OFFLINE=true cargo metadata --format-version 1 >/dev/null
          ls -la ~/.cargo/git/checkouts/
      - name: Copy it into vendor/ and check the license
        run: |
          src=$(ls -d ~/.cargo/git/checkouts/ely-gpui-components-*/b0dbfd4* | head -1)
          test -n "$src"
          echo "from $src"
          mkdir -p vendor
          rm -rf vendor/ely-gpui-component
          rsync -a --exclude .git --exclude target "$src"/ vendor/ely-gpui-component/
          du -sh vendor/ely-gpui-component
          ls -la vendor/ely-gpui-component
          sed -n 1,60p vendor/ely-gpui-component/Cargo.toml
          lic=$(ls vendor/ely-gpui-component | grep -i -E '^(licen[cs]e|copying)' || true)
          echo "license files: ${lic:-NONE}"
          test -n "$lic"
          for f in $lic; do echo "== $f"; head -25 "vendor/ely-gpui-component/$f"; done
          cat $(printf 'vendor/ely-gpui-component/%s ' $lic) | grep -q -i -E 'MIT License|Permission is hereby granted|Apache License' \
            || { echo "Not an MIT/Apache license: not vendoring"; exit 1; }
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/ely-gpui-component
          git commit -q -m "Vendor Ely GPUI Components at b0dbfd4 (recovered from CI's cargo cache)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
