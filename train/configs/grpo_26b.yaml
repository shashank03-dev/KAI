# Online GRPO against Kai's bench checks, starting from the SFT adapter.
# One H100 80GB holds either vLLM serving 26B-A4B or the bf16 trainer, not
# both at full size, so the two phases take turns: vLLM sleeps (weights to
# CPU) during the update and the trainer moves to CPU during rollouts.
model: google/gemma-4-26B-A4B-it
init_adapter: train/out/sft-26b/adapter
initial_policy: kai              # vLLM --lora-modules kai=<init_adapter>
output_dir: train/out/grpo-26b
vllm_url: http://127.0.0.1:8000
vllm_path_map: /root/KAI/train/out=/adapters   # host dir mounted into the vLLM container
vllm_sleep: true
offload_between_phases: true
iterations: 20
tasks_per_iter: 8
group_size: 8
desktops: 4
temperature: 1.0
top_p: 0.95
top_k: 64
lr: 1.0e-5
inner_epochs: 1
updates_per_iter: 4
clip_eps: 0.2
kl_beta: 0.02
step_penalty: 0.01
time_penalty_per_min: 0.02
format_weight: 0.2
episode_timeout_s: 660
