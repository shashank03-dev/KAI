# LoRA SFT of Gemma 4 26B-A4B (MoE, 25.2B total / 3.8B active) on one H100 80GB.
# bf16 LoRA: ~50 GB of frozen weights + activations at batch 1 with gradient
# checkpointing. 4-bit (bitsandbytes) barely helps on this model: its experts
# are 3-D nn.Parameters that bnb does not quantize, so keep load_in_4bit false.
model: google/gemma-4-26B-A4B-it
output_dir: train/out/sft-26b
max_len: 4096
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
load_in_4bit: false
epochs: 2
lr: 1.0e-4
warmup_steps: 20
per_device_batch: 1
grad_accum: 16
eval_steps: 100
save_steps: 200
