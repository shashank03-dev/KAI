<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact us - Kai Bench</title>
<style>
body { font-family: sans-serif; max-width: 560px; margin: 40px auto; }
label { display: block; margin-top: 14px; }
input, textarea, select { width: 100%; font-size: 16px; padding: 6px; }
button { margin-top: 18px; font-size: 16px; padding: 8px 18px; }
</style>
</head>
<body>
<h1>Contact us</h1>
<form method="post" action="/submit">
  <label for="name">Full name</label>
  <input id="name" name="name" type="text" autocomplete="off">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="off">
  <label for="topic">Topic</label>
  <select id="topic" name="topic">
    <option value="general">General question</option>
    <option value="billing">Billing</option>
    <option value="support">Technical support</option>
  </select>
  <label for="message">Message</label>
  <textarea id="message" name="message" rows="4"></textarea>
  <button type="submit">Send message</button>
</form>
</body>
</html>
