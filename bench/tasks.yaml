    - '{"thought":"screenshot saved","action":"done","risk":"none"}'

# ------------------------------------------------- settings / terminal ----

- id: dark-mode
  title: Change a setting (dark mode)
  kind: mixed
  prompt: Switch my computer to dark mode.
  setup:
    linux: gsettings set org.gnome.desktop.interface color-scheme default
    windows: Set-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize -Name AppsUseLightTheme -Value 1
    macos: defaults delete -g AppleInterfaceStyle 2>/dev/null; true
  check:
    linux: gsettings get org.gnome.desktop.interface color-scheme | grep -q dark
    macos: defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark
    windows: if ((Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize).AppsUseLightTheme -eq 0) { exit 0 } else { exit 1 }
  mock:
    - '{"thought":"set the GNOME color scheme","action":"shell","text":"gsettings set org.gnome.desktop.interface color-scheme prefer-dark","risk":"high","expect":"dark windows"}'
    - '{"thought":"dark mode is on","action":"done","risk":"none"}'

- id: disk-space
  title: Answer a question from the terminal
  kind: terminal
  prompt: How much free disk space do I have on my home drive? Write just the number in GB to kai-bench/answer.txt in my home folder.
  setup:
    linux: mkdir -p ~/kai-bench && rm -f ~/kai-bench/answer.txt
    windows: New-Item -ItemType Directory -Force $HOME\kai-bench | Out-Null; Remove-Item -ErrorAction SilentlyContinue $HOME\kai-bench\answer.txt
  check:
    linux: grep -Eq '^[0-9]+([.][0-9]+)?' ~/kai-bench/answer.txt
    windows: if ((Get-Content $HOME\kai-bench\answer.txt -Raw) -match '^\d') { exit 0 } else { exit 1 }
  mock:
    - '{"thought":"check free space","action":"shell","text":"df -Pk ~ | awk ''NR==2 {print int($4/1048576)}''","risk":"low","expect":"a number"}'
    - '{"thought":"write the answer","action":"shell","text":"df -Pk ~ | awk ''NR==2 {print int($4/1048576)}'' > ~/kai-bench/answer.txt","risk":"low","expect":"saved"}'
    - '{"thought":"answer saved","action":"done","risk":"none"}'

- id: count-errors
  title: Count errors in a log file
  kind: terminal
  prompt: How many lines in kai-bench/app.log (in my home folder) contain ERROR? Write just the number into kai-bench/errors.txt.
  setup:
    linux: |
      mkdir -p ~/kai-bench && rm -f ~/kai-bench/errors.txt && : > ~/kai-bench/app.log &&
      for i in $(seq 1 40); do
        case $((i % 6)) in 0) echo "2026-10-09 10:$((i+10)):00 ERROR upload failed (retry $i)";; *) echo "2026-10-09 10:$((i+10)):00 INFO request ok";; esac >> ~/kai-bench/app.log;
      done
  check:
    linux: test "$(tr -dc 0-9 < ~/kai-bench/errors.txt)" = "$(grep -c ERROR ~/kai-bench/app.log)"
  mock:
    - '{"thought":"count matching lines","action":"shell","text":"grep -c ERROR ~/kai-bench/app.log | tee ~/kai-bench/errors.txt","risk":"low","expect":"a number"}'
    - '{"thought":"6 error lines","action":"done","risk":"none"}'

- id: run-script
  title: Run a script and keep its output
  kind: terminal
  prompt: Run the script kai-bench/jobs/build.sh in my home folder and save everything it prints into kai-bench/jobs/build.log.
  setup:
    linux: rm -rf ~/kai-bench/jobs && mkdir -p ~/kai-bench/jobs && printf '#!/bin/sh\necho "compiling 3 files"\nsleep 1\necho "linking"\necho "BUILD OK" >&2\n' > ~/kai-bench/jobs/build.sh && chmod +x ~/kai-bench/jobs/build.sh
  check:
    linux: grep -q 'compiling 3 files' ~/kai-bench/jobs/build.log && grep -q 'BUILD OK' ~/kai-bench/jobs/build.log
  mock:
    - '{"thought":"run it, keep stdout and stderr","action":"shell","text":"cd ~/kai-bench/jobs && ./build.sh > build.log 2>&1; cat build.log","risk":"low","expect":"BUILD OK"}'
    - '{"thought":"build ran, log saved","action":"done","risk":"none"}'

- id: pc-checkup
  title: Security check-up of this PC
  kind: terminal
  prompt: Is my firewall turned on? Check, and tell me what to do if it is off.
  mock:
    - '{"thought":"check firewall","action":"shell","text":"ufw status 2>/dev/null || echo no ufw","risk":"low","expect":"status"}'
    - '{"thought":"firewall status reported","action":"done","risk":"none"}'
