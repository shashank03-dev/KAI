[package]
name = "kai-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Kai's desktop app: GPUI with Ely GPUI Components."

[[bin]]
name = "kai-app"
path = "src/main.rs"

[dependencies]
kai-core = { path = "../kai-core" }
kai-os = { path = "../kai-os" }
gpui.workspace = true
# Without x11/wayland, gpui-pre-linux builds a headless-only platform and no
# window is ever shown on Linux (the features are ignored on Windows).
gpui_platform = { workspace = true, features = ["x11", "wayland"] }
ely-gpui-component.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
tokio = { workspace = true, features = ["full"] }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
image.workspace = true
xcap = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
async-trait = "0.1"

[lints.clippy]
all = { level = "warn", priority = -1 }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"

# The Metal shaders are compiled when the app starts instead of by
# `xcrun metal` at build time, which needs the full Xcode (the Command Line
# Tools most Macs have do not ship the Metal compiler).
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { workspace = true, features = ["runtime_shaders"] }
