[workspace]
resolver = "2"
members = [
    "crates/kai-core",
    "crates/kai-os",
    "crates/kai-cli",
    "crates/kai-app",
]
default-members = ["crates/kai-core", "crates/kai-os", "crates/kai-cli"]
# The vendored Ely is a dependency, not ours to lint or test.
exclude = ["vendor/ely-gpui-component"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/shashank03-dev/KAI"
authors = ["Kai contributors"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
jiff = "0.2"
smallvec = "1"
rand = "0.8"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }

# These two are the Ely/GPUI snapshot. Pinned exactly; see DECISIONS.md.
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false, features = ["stacker"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }
# Vendored at the pinned rev b0dbfd4 (MIT): the upstream repository can no
# longer be cloned, so CI and fresh checkouts build from this copy. See
# vendor/README.md.
ely-gpui-component = { path = "vendor/ely-gpui-component" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
